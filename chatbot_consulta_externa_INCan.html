<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente Virtual - Consulta Externa</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;color:#222}
.app{width:min(430px,100%);height:100vh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 20px #0001}
.header{background:#7b1e2b;color:white;padding:18px 20px}
.header h1{font-size:18px;margin:0 0 5px}
.header p{font-size:12px;margin:0;opacity:.9}
.chat{flex:1;overflow:auto;padding:18px;background:#f7f7f8}
.msg{max-width:85%;padding:11px 13px;border-radius:15px;margin:8px 0;line-height:1.4;font-size:14px;white-space:pre-line}
.bot{background:#fff;border:1px solid #ddd;border-bottom-left-radius:4px}
.user{background:#7b1e2b;color:white;margin-left:auto;border-bottom-right-radius:4px}
.options{display:flex;flex-direction:column;gap:8px;margin:10px 0 15px}
button{border:1px solid #7b1e2b;background:white;color:#7b1e2b;padding:11px;border-radius:9px;text-align:left;cursor:pointer;font-size:14px}
button:hover{background:#f8e9ec}
.input{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd;background:white}
input{flex:1;padding:11px;border:1px solid #ccc;border-radius:9px}
.send{background:#7b1e2b;color:#fff;border:none;text-align:center}
.small{font-size:11px;color:#777;margin-top:4px}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>Asistente Virtual de Consulta Externa</h1>
    <p>Instituto Nacional de Cardiología</p>
  </header>
  <main id="chat" class="chat"></main>
  <div class="input">
    <input id="text" placeholder="Escribe tu solicitud..." onkeydown="if(event.key==='Enter')sendText()">
    <button class="send" onclick="sendText()">Enviar</button>
  </div>
</div>

<script>
const chat=document.getElementById('chat');
const input=document.getElementById('text');

function add(text,who='bot'){
  const d=document.createElement('div');
  d.className='msg '+who;
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
function options(items){
  const box=document.createElement('div');
  box.className='options';
  items.forEach(x=>{
    const b=document.createElement('button');
    b.textContent=x[0];
    b.onclick=()=>{add(x[0],'user'); box.remove(); x[1]();};
    box.appendChild(b);
  });
  chat.appendChild(box);
  chat.scrollTop=chat.scrollHeight;
}
function menu(){
  add('Hola, bienvenido al Asistente Virtual de Consulta Externa.\\n\\n¿En qué puedo ayudarte?');
  options([
    ['📅 Agendar una cita',agenda],
    ['🔄 Reagendar una cita',reagendar],
    ['ℹ️ Información de Consulta Externa',info],
    ['🔔 Consultar mi cita',consultar]
  ]);
}
function askData(text,next){
  add(text);
  input.focus();
  input.dataset.next=next;
}
function sendText(){
  const v=input.value.trim();
  if(!v)return;
  add(v,'user'); input.value='';
  const next=input.dataset.next;
  input.dataset.next='';
  if(next==='agendaNombre') agendaFecha(v);
  else if(next==='agendaFecha') agendaHora(v);
  else if(next==='agendaHora') confirmAgenda(v);
  else if(next==='idReag') reagendarFecha(v);
  else if(next==='reagFecha') confirmReag(v);
  else if(next==='consultaId') mostrarCita(v);
  else{
    const l=v.toLowerCase();
    if(l.includes('agend')) agenda();
    else if(l.includes('reagend')||l.includes('cambiar')) reagendar();
    else if(l.includes('horario')||l.includes('inform')) info();
    else menu();
  }
}
function agenda(){
  askData('Para agendar una cita, escribe tu nombre completo.','agendaNombre');
}
function agendaFecha(nombre){
  add('Gracias, '+nombre+'. Selecciona una fecha disponible.');
  options([
    ['Lunes 17 de agosto',()=>agendaHora('Lunes 17 de agosto')],
    ['Martes 18 de agosto',()=>agendaHora('Martes 18 de agosto')],
    ['Miércoles 19 de agosto',()=>agendaHora('Miércoles 19 de agosto')]
  ]);
}
function agendaHora(fecha){
  if(fecha==='Lunes 17 de agosto'||fecha==='Martes 18 de agosto'||fecha==='Miércoles 19 de agosto'){
    add('Fecha seleccionada: '+fecha+'\\n\\nSelecciona un horario disponible.');
    options([
      ['09:00 h',()=>confirmAgenda('09:00 h')],
      ['10:00 h',()=>confirmAgenda('10:00 h')],
      ['12:00 h',()=>confirmAgenda('12:00 h')]
    ]);
  }else confirmAgenda(fecha);
}
function confirmAgenda(hora){
  add('Tu cita ha sido registrada correctamente.\\n\\nServicio: Consulta Externa\\nFecha: La fecha seleccionada\\nHorario: '+hora+'\\n\\nRecibirás una confirmación y un recordatorio antes de tu cita.');
  options([['Volver al menú principal',menu]]);
}
function reagendar(){
  askData('Para localizar tu cita, escribe el dato de identificación solicitado por la institución.','idReag');
}
function reagendarFecha(id){
  add('He localizado una cita asociada al dato proporcionado. Selecciona una nueva fecha disponible.');
  options([
    ['Lunes 17 de agosto',()=>confirmReag('Lunes 17 de agosto')],
    ['Miércoles 19 de agosto',()=>confirmReag('Miércoles 19 de agosto')],
    ['Jueves 20 de agosto',()=>confirmReag('Jueves 20 de agosto')]
  ]);
}
function confirmReag(fecha){
  add('Tu cita ha sido reagendada correctamente.\\n\\nNueva fecha: '+fecha+'\\nServicio: Consulta Externa\\n\\nRecibirás una confirmación de la modificación y un recordatorio antes de tu cita.');
  options([['Volver al menú principal',menu]]);
}
function info(){
  add('Puedo proporcionarte información administrativa de Consulta Externa, como horarios de atención, días disponibles y orientación para realizar una cita.');
  options([
    ['🕐 Consultar horarios',horarios],
    ['📅 Consultar disponibilidad',disponibilidad],
    ['⬅️ Volver al menú',menu]
  ]);
}
function horarios(){
  add('Horarios de Consulta Externa:\\n\\nLunes a viernes\\n09:00 a 14:00 h\\n\\nLos horarios mostrados son únicamente demostrativos para este prototipo.');
  options([['Volver a información',info],['Volver al menú',menu]]);
}
function disponibilidad(){
  add('La disponibilidad se consulta al momento de solicitar una cita y depende de los espacios registrados en el sistema institucional.');
  options([['Agendar una cita',agenda],['Volver al menú',menu]]);
}
function consultar(){
  askData('Para consultar tu cita, escribe el dato de identificación solicitado por la institución.','consultaId');
}
function mostrarCita(id){
  add('Cita localizada.\\n\\nServicio: Consulta Externa\\nFecha: 24 de agosto\\nHora: 10:00 h\\nEstatus: Confirmada\\n\\nEste resultado es demostrativo para el prototipo.');
  options([['🔄 Reagendar cita',reagendar],['⬅️ Volver al menú',menu]]);
}
menu();
</script>
</body>
</html>
